<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .email-box {
      background: #fff;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .logo {
      height: 60px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #e16123;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="email-box">
    <img src="https://yourdomain.com/static/logo.png" alt="License Manager Logo" class="logo" />
    <h2>Hello!</h2>
    <p>You requested to reset your password. Click below to continue:</p>
    <a href="{{ reset_url }}" class="btn">Reset Password</a>
    <p class="footer">If you didn’t request this, you can ignore this email.</p>
  </div>
</body>
</html>
